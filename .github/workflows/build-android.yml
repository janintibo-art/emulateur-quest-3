name: Build APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  APK_NAME: emulateur_quest_3_v2.apk

jobs:
  build-android:
    name: APK téléphone
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Préparer Godot 4.7.2 et Android
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          if [ -d /root/.config/godot ]; then cp -R /root/.config/godot ~/.config/; fi
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then cp -R /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/; fi
          godot --version

      - name: Importer le projet
        shell: bash
        run: godot --headless --editor --quit-after 2

      - name: Construire l'APK debug
        shell: bash
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" "build/${APK_NAME}"
          test -f "build/${APK_NAME}"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: emulateur-quest-3-v2-apk
          path: build/emulateur_quest_3_v2.apk
          if-no-files-found: error
          retention-days: 30
